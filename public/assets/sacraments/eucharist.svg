<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B1D2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A1018;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5D780;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <circle cx="400" cy="250" r="180" fill="none" stroke="rgba(212,168,67,0.1)" stroke-width="1"/>
  <circle cx="400" cy="250" r="140" fill="none" stroke="rgba(212,168,67,0.15)" stroke-width="1"/>
  <circle cx="400" cy="250" r="100" fill="none" stroke="rgba(212,168,67,0.2)" stroke-width="1"/>
  
  <!-- Host/Wafer icon -->
  <g transform="translate(400, 180)" fill="url(#gold)">
    <circle cx="0" cy="0" r="35" opacity="0.9"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#6B1D2A" stroke-width="2"/>
    <text x="0" y="8" font-family="Georgia, serif" font-size="28" fill="#6B1D2A" text-anchor="middle" font-weight="bold">†</text>
  </g>
  
  <!-- Rays -->
  <g transform="translate(400, 180)" stroke="#D4A843" stroke-width="1" opacity="0.4">
    <line x1="0" y1="-55" x2="0" y2="-70"/>
    <line x1="39" y1="-39" x2="49" y2="-49"/>
    <line x1="55" y1="0" x2="70" y2="0"/>
    <line x1="39" y1="39" x2="49" y2="49"/>
    <line x1="0" y1="55" x2="0" y2="70"/>
    <line x1="-39" y1="39" x2="-49" y2="49"/>
    <line x1="-55" y1="0" x2="-70" y2="0"/>
    <line x1="-39" y1="-39" x2="-49" y2="-49"/>
  </g>
  
  <text x="400" y="300" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#D4A843" text-anchor="middle" font-style="italic">Eucharist</text>
  
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="3">Paroisse Saint-Joseph Artisan</text>
  
  <line x1="350" y1="360" x2="450" y2="360" stroke="#D4A843" stroke-width="1" opacity="0.5"/>
  
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle">Replace with parish photo</text>
</svg>